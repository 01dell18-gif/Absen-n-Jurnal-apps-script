<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden antialiased">

  <div class="flex-1 flex flex-col h-screen overflow-hidden w-full">

    <main class="flex-1 overflow-y-auto p-4 md:p-6 pb-24 w-full bg-slate-50 space-y-6">
      
      <!-- CARD FORM PARAMETER ABSENSI -->
      <div class="bg-white p-5 md:p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-5">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-blue-50 text-brand-600 flex items-center justify-center text-sm border border-blue-100">
              <i class="fa-solid fa-clipboard-list"></i>
            </div>
            <div>
              <h3 class="text-sm font-bold text-slate-800">Pilih Parameter Kelas & Pelajaran</h3>
              <p class="text-[11px] text-slate-400">Tentukan data KBM sebelum memuat presensi murid</p>
            </div>
          </div>
          <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
            Form Aktif
          </span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3.5">
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">Nama Guru</label>
            <select id="form-absen-guru" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50 border-slate-200 outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition"></select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">Mata Pelajaran</label>
            <select id="form-absen-mapel" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50 border-slate-200 outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition"></select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">Rombel / Kelas</label>
            <select id="form-absen-kelas" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50 border-slate-200 outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition"></select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">Semester</label>
            <select id="form-absen-semester" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50 border-slate-200 outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
              <option value="Ganjil">Ganjil</option>
              <option value="Genap">Genap</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">Tanggal Pertemuan</label>
            <input type="date" id="form-absen-tanggal" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50 border-slate-200 outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">Tahun Ajaran</label>
            <select id="form-absen-ta" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50 border-slate-200 outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition"></select>
          </div>
        </div>

        <div class="flex justify-end pt-2">
          <button onclick="loadMuridForAbsen()" class="w-full sm:w-auto px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl shadow-md shadow-brand-600/20 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-users-viewfinder"></i>
            <span>Tampilkan Daftar Siswa</span>
          </button>
        </div>
      </div>

      <!-- CONTAINER TABEL INPUT PRESENSI -->
      <div id="container-input-absen" class="hidden bg-white p-5 md:p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
        
        <!-- Toolbar Atas Tabel Presensi -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 pb-3">
          <div>
            <h3 class="text-sm font-extrabold text-slate-800 flex items-center gap-2">
              <span>Daftar Siswa Kelas</span>
              <span id="label-kelas-terpilih" class="px-2.5 py-0.5 rounded-lg bg-blue-50 text-brand-700 text-xs font-bold border border-blue-200">-</span>
            </h3>
            <p class="text-[11px] text-slate-400 mt-0.5">Ubah status presensi sesuai kehadiran siswa di kelas.</p>
          </div>

          <div class="flex items-center gap-2 w-full sm:w-auto">
            <button onclick="setSemuaStatus('Hadir')" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-lg text-xs font-bold transition flex items-center gap-1.5" title="Set Semua Menjadi Hadir">
              <i class="fa-solid fa-check-double"></i> Set Semua Hadir
            </button>
            <button onclick="setSemuaStatus('Alpa')" class="px-3 py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 rounded-lg text-xs font-semibold transition" title="Reset">
              Reset
            </button>
          </div>
        </div>

        <!-- Tabel Siswa -->
        <div class="overflow-x-auto border border-slate-200 rounded-xl">
          <table class="w-full text-xs text-left whitespace-nowrap">
            <thead class="bg-slate-50 font-bold border-b border-slate-200 text-slate-500 uppercase text-[10px] tracking-wider">
              <tr>
                <th class="p-3 w-12 text-center">No</th>
                <th class="p-3 w-28">NISN</th>
                <th class="p-3">Nama Siswa</th>
                <th class="p-3 w-16 text-center">L/P</th>
                <th class="p-3 w-44 text-center">Keterangan Kehadiran</th>
              </tr>
            </thead>
            <tbody id="tbody-input-absen" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>

        <!-- Tombol Kirim Ke Server -->
        <div class="flex flex-col sm:flex-row justify-between items-center pt-3 gap-3">
          <div class="text-[11px] text-slate-500">
            Total Siswa Dimuat: <strong id="count-murid-loaded" class="text-slate-800">0</strong> Siswa
          </div>
          <button onclick="submitAbsensiData()" class="w-full sm:w-auto px-7 py-3 bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-700 hover:to-emerald-800 text-white text-xs font-bold rounded-xl shadow-lg shadow-emerald-600/25 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane"></i>
            <span>Simpan & Kirim Rekap Absen</span>
          </button>
        </div>
      </div>

    </main>
  </div>

  <?!= include('AppJS'); ?>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById('form-absen-tanggal').valueAsDate = new Date();
      setupGuruField();
    });

    function onDataLoaded(data) {
      if (!data || !data.pengaturan) return;
      const p = data.pengaturan;
      populateSelect('form-absen-mapel', p.mapelList, '-- Pilih Mapel --');
      populateSelect('form-absen-kelas', p.kelasList, '-- Pilih Kelas --');
      populateSelect('form-absen-ta', p.taList, '-- Pilih TA --');

      setupGuruField();
    }

    function setupGuruField() {
      const role = getCurrentRole();
      const loggedGuru = getLoggedInNamaGuru();
      const selGuru = document.getElementById('form-absen-guru');
      if (!selGuru) return;

      const guruList = (window.globalData && window.globalData.guruList) ? window.globalData.guruList : [];
      const guruNames = guruList.map(g => g.nama);

      if (role === 'Guru') {
        const guruVal = loggedGuru || getCurrentUser();
        selGuru.innerHTML = `<option value="${guruVal}">${guruVal}</option>`;
        selGuru.value = guruVal;
        selGuru.disabled = true;
        selGuru.classList.add('bg-slate-100', 'cursor-not-allowed', 'font-bold', 'text-slate-700');
      } else {
        selGuru.disabled = false;
        selGuru.classList.remove('bg-slate-100', 'cursor-not-allowed', 'font-bold');
        populateSelect('form-absen-guru', guruNames, '-- Pilih Guru --', loggedGuru);
      }
    }

    function loadMuridForAbsen() {
      const kelas = document.getElementById('form-absen-kelas').value;
      if (!kelas) {
        showToast('warning', 'Pilih Kelas', 'Silakan pilih kelas terlebih dahulu.');
        return;
      }

      const filtered = (window.globalData.muridList || []).filter(m => m.kelas === kelas);
      const tbody = document.getElementById('tbody-input-absen');
      tbody.innerHTML = "";

      if (filtered.length === 0) {
        document.getElementById('container-input-absen').classList.add('hidden');
        Swal.fire({
          icon: 'info',
          title: 'Tidak Ada Siswa',
          text: `Belum ada data siswa yang terdaftar di kelas "${kelas}". Silakan cek Master Data.`,
          confirmButtonColor: '#2563eb'
        });
        return;
      }

      document.getElementById('label-kelas-terpilih').innerText = kelas;
      document.getElementById('count-murid-loaded').innerText = filtered.length;

      filtered.forEach((m, i) => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 text-center text-slate-400 font-mono text-[11px]">${i + 1}</td>
            <td class="p-3 font-mono text-slate-500 text-[11px]">${m.nisn}</td>
            <td class="p-3 font-semibold text-slate-800">${m.nama}</td>
            <td class="p-3 text-center">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold ${m.jk === 'L' ? 'bg-blue-50 text-brand-700' : 'bg-pink-50 text-pink-700'}">
                ${m.jk || '-'}
              </span>
            </td>
            <td class="p-3">
              <select data-nisn="${m.nisn}" data-nama="${m.nama}" data-jk="${m.jk}" 
                      class="select-ket-absen w-full text-xs p-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-brand-500 bg-white font-medium text-slate-700">
                <option value="Hadir" selected>Hadir</option>
                <option value="Sakit">Sakit</option>
                <option value="Izin">Izin</option>
                <option value="Alpa">Alpa</option>
                <option value="Dispen">Dispen</option>
              </select>
            </td>
          </tr>
        `;
      });

      document.getElementById('container-input-absen').classList.remove('hidden');
      document.getElementById('container-input-absen').scrollIntoView({ behavior: 'smooth' });
    }

    function setSemuaStatus(status) {
      document.querySelectorAll('.select-ket-absen').forEach(el => {
        el.value = status;
      });
      showToast('info', 'Diperbarui', `Semua siswa ditandai sebagai: ${status}`);
    }

    function submitAbsensiData() {
      const role = getCurrentRole();
      const loggedGuru = getLoggedInNamaGuru();
      const guru = (role === 'Guru' && loggedGuru) ? loggedGuru : (document.getElementById('form-absen-guru').value || loggedGuru || getCurrentUser());
      const mapel = document.getElementById('form-absen-mapel').value;
      const kelas = document.getElementById('form-absen-kelas').value;
      const semester = document.getElementById('form-absen-semester').value;
      const tanggal = document.getElementById('form-absen-tanggal').value;
      const ta = document.getElementById('form-absen-ta').value;

      if (!guru || !mapel || !kelas || !semester || !tanggal || !ta) {
        showToast('warning', 'Data Belum Lengkap', 'Pastikan semua kolom parameter absensi telah terisi.');
        return;
      }

      const attendanceList = Array.from(document.querySelectorAll('.select-ket-absen')).map(s => ({
        nisn: s.getAttribute('data-nisn'),
        nama: s.getAttribute('data-nama'),
        jk: s.getAttribute('data-jk'),
        keterangan: s.value
      }));

      if (attendanceList.length === 0) {
        showToast('error', 'Gagal', 'Daftar presensi siswa kosong.');
        return;
      }

      const formHeader = { namaGuru: guru, mapel, kelas, semester, tanggal, tahunAjaran: ta };

      showLoading('Menyimpan Absensi...');
      google.script.run
        .withSuccessHandler(function(res) {
          closeLoading();
          if (res && res.success) {
            Swal.fire({
              icon: 'success',
              title: 'Absensi Tersimpan!',
              text: `Berhasil mencatat ${res.count} presensi siswa kelas ${kelas} ke database.`,
              confirmButtonColor: '#2563eb',
              confirmButtonText: 'Buka Rekap Absen',
              showCancelButton: true,
              cancelButtonText: 'Input Lagi'
            }).then(result => {
              if (result.isConfirmed) {
                navigateTo('rekap-absen');
              } else {
                document.getElementById('container-input-absen').classList.add('hidden');
              }
            });
          } else {
            Swal.fire({
              icon: 'error',
              title: 'Gagal Menyimpan',
              text: (res && res.message) ? res.message : 'Terjadi kesalahan di server.'
            });
          }
        })
        .withFailureHandler(function(err) {
          closeLoading();
          Swal.fire({
            icon: 'error',
            title: 'Kesalahan Sistem',
            text: err.message
          });
        })
        .submitAbsensi(formHeader, attendanceList);
    }
  </script>
</body>
</html>
