<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden antialiased">
  
  <?!= include('Sidebar'); ?>

  <div class="flex-1 flex flex-col h-screen overflow-hidden w-full">
    <?!= include('Header', { pageTitle: 'Presensi Kehadiran Siswa' }); ?>

    <main class="flex-1 overflow-y-auto p-4 md:p-6 pb-24 w-full bg-slate-50 space-y-6">
      
      <!-- CARD FORM PARAMETER ABSENSI -->
      <div class="bg-white p-5 md:p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-5">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-blue-50 text-brand-600 flex items-center justify-center text-sm border border-blue-100">
              <i class="fa-solid fa-clipboard-list"></i>
            </div>
            <div>
              <h3 id="form-absen-title" class="text-sm font-bold text-slate-800">Pilih Parameter Kelas & Pelajaran</h3>
              <p id="form-absen-subtitle" class="text-[11px] text-slate-400">Tentukan data KBM sebelum memuat presensi murid</p>
            </div>
          </div>
          <span id="badge-form-status" class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
            Form Aktif
          </span>
        </div>

        <div id="form-absen-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3.5">
          <div id="container-field-guru">
            <label class="block text-[11px] font-bold text-slate-700 mb-1">Nama Guru</label>
            <select id="form-absen-guru" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50 border-slate-200 outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition"></select>
          </div>
          <div id="container-field-mapel">
            <label class="block text-[11px] font-bold text-slate-700 mb-1">Mata Pelajaran</label>
            <div class="datalist-input-wrapper">
              <input type="text" id="form-absen-mapel" list="list-form-absen-mapel" autocomplete="off"
                placeholder="-- Pilih / Ketik Mapel --" onfocus="this.select()"
                class="w-full text-xs p-2.5 pr-8 border rounded-xl bg-slate-50 border-slate-200 outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition text-slate-800">
              <datalist id="list-form-absen-mapel"></datalist>
              <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
                <i class="fa-solid fa-chevron-down text-[10px]"></i>
              </div>
            </div>
          </div>
          <div id="container-field-kelas">
            <label class="block text-[11px] font-bold text-slate-700 mb-1">Rombel / Kelas</label>
            <div class="datalist-input-wrapper">
              <input type="text" id="form-absen-kelas" list="list-form-absen-kelas" autocomplete="off"
                placeholder="-- Pilih / Ketik Kelas --" onfocus="this.select()"
                class="w-full text-xs p-2.5 pr-8 border rounded-xl bg-slate-50 border-slate-200 outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition text-slate-800">
              <datalist id="list-form-absen-kelas"></datalist>
              <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
                <i class="fa-solid fa-chevron-down text-[10px]"></i>
              </div>
            </div>
          </div>
          <div id="container-field-semester">
            <label class="block text-[11px] font-bold text-slate-700 mb-1">Semester</label>
            <select id="form-absen-semester" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50 border-slate-200 outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
              <option value="Ganjil">Ganjil</option>
              <option value="Genap">Genap</option>
            </select>
          </div>
          <div id="container-field-tanggal">
            <label class="block text-[11px] font-bold text-slate-700 mb-1">Tanggal Pertemuan</label>
            <input type="date" id="form-absen-tanggal" onchange="onFormAbsenTanggalChange()" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50 border-slate-200 outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
          </div>
          <div id="container-field-ta">
            <label class="block text-[11px] font-bold text-slate-700 mb-1">Tahun Ajaran</label>
            <select id="form-absen-ta" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50 border-slate-200 outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition"></select>
          </div>
        </div>

        <div class="flex justify-end pt-2">
          <button onclick="loadMuridForAbsen()" class="w-full sm:w-auto px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl shadow-md shadow-brand-600/20 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-users-viewfinder"></i>
            <span>Tampilkan Daftar Siswa</span>
          </button>
        </div>
      </div>

      <!-- CONTAINER TABEL INPUT PRESENSI -->
      <div id="container-input-absen" class="hidden bg-white p-5 md:p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
        
        <!-- Toolbar Atas Tabel Presensi -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 pb-3">
          <div>
            <h3 class="text-sm font-extrabold text-slate-800 flex items-center gap-2">
              <span>Daftar Siswa Kelas</span>
              <span id="label-kelas-terpilih" class="px-2.5 py-0.5 rounded-lg bg-blue-50 text-brand-700 text-xs font-bold border border-blue-200">-</span>
            </h3>
            <p class="text-[11px] text-slate-400 mt-0.5">Ubah status presensi sesuai kehadiran siswa di kelas.</p>
          </div>

          <div class="flex items-center gap-2 w-full sm:w-auto">
            <button onclick="setSemuaStatus('Hadir')" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-lg text-xs font-bold transition flex items-center gap-1.5" title="Set Semua Menjadi Hadir">
              <i class="fa-solid fa-check-double"></i> Set Semua Hadir
            </button>
            <button onclick="setSemuaStatus('Alpa')" class="px-3 py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 rounded-lg text-xs font-semibold transition" title="Reset">
              Reset
            </button>
          </div>
        </div>

        <!-- Banner Presensi Tersinkron Otomatis -->
        <div id="banner-presensi-sinkron" class="hidden"></div>

        <!-- Tabel Siswa -->
        <div class="overflow-x-auto border border-slate-200 rounded-xl">
          <table class="w-full text-xs text-left whitespace-nowrap">
            <thead class="bg-slate-50 font-bold border-b border-slate-200 text-slate-500 uppercase text-[10px] tracking-wider">
              <tr>
                <th class="p-3 w-12 text-center">No</th>
                <th class="p-3 w-28">NISN</th>
                <th class="p-3">Nama Siswa</th>
                <th class="p-3 w-16 text-center">L/P</th>
                <th class="p-3 w-44 text-center">Keterangan Kehadiran</th>
              </tr>
            </thead>
            <tbody id="tbody-input-absen" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>

        <!-- Tombol Kirim Ke Server -->
        <div class="flex flex-col sm:flex-row justify-between items-center pt-3 gap-3">
          <div class="text-[11px] text-slate-500">
            Total Siswa Dimuat: <strong id="count-murid-loaded" class="text-slate-800">0</strong> Siswa
          </div>
          <button onclick="submitAbsensiData()" class="w-full sm:w-auto px-7 py-3 bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-700 hover:to-emerald-800 text-white text-xs font-bold rounded-xl shadow-lg shadow-emerald-600/25 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane"></i>
            <span>Simpan & Kirim Rekap Absen</span>
          </button>
        </div>
      </div>

    </main>
  </div>

  <?!= include('AppJS'); ?>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById('form-absen-tanggal').valueAsDate = new Date();
      if (typeof getAutoSemester === 'function') {
        document.getElementById('form-absen-semester').value = getAutoSemester(document.getElementById('form-absen-tanggal').value);
      }
      adjustFormForRole();
      setupGuruField();
      setupKelasField();
    });

    function onFormAbsenTanggalChange() {
      const tgl = document.getElementById('form-absen-tanggal').value;
      if (typeof getAutoSemester === 'function') {
        document.getElementById('form-absen-semester').value = getAutoSemester(tgl);
      }
    }

    function adjustFormForRole() {
      const role = getCurrentRole();
      const isMurid = role.toLowerCase() === 'murid';
      const contGuru = document.getElementById('container-field-guru');
      const contMapel = document.getElementById('container-field-mapel');
      const grid = document.getElementById('form-absen-grid');
      const title = document.getElementById('form-absen-title');
      const subtitle = document.getElementById('form-absen-subtitle');
      const badge = document.getElementById('badge-form-status');

      if (isMurid) {
        if (contGuru) contGuru.classList.add('hidden');
        if (contMapel) contMapel.classList.add('hidden');
        if (grid) {
          grid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5';
        }
        if (title) title.innerText = 'Presensi Harian Kehadiran Siswa';
        if (subtitle) subtitle.innerText = 'Catat presensi harian kehadiran teman sekelas hari ini';
        if (badge) {
          badge.className = 'text-[10px] font-bold px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200';
          badge.innerHTML = '<i class="fa-solid fa-user-graduate mr-1"></i> Presensi Murid';
        }
      } else {
        if (contGuru) contGuru.classList.remove('hidden');
        if (contMapel) contMapel.classList.remove('hidden');
        if (grid) {
          grid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3.5';
        }
        if (title) title.innerText = 'Pilih Parameter Kelas & Pelajaran';
        if (subtitle) subtitle.innerText = 'Tentukan data KBM sebelum memuat presensi murid';
        if (badge) {
          badge.className = 'text-[10px] font-bold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200';
          badge.innerText = 'Form Aktif';
        }
      }
    }

    function onDataLoaded(data) {
      if (!data || !data.pengaturan) return;
      const p = data.pengaturan;
      populateSelect('form-absen-mapel', p.mapelList, '-- Pilih Mapel --');
      populateSelect('form-absen-kelas', p.kelasList, '-- Pilih Kelas --');
      populateSelect('form-absen-ta', p.taList, '-- Pilih TA --', p.tahunAjaranAktif);

      if (typeof getAutoSemester === 'function') {
        document.getElementById('form-absen-semester').value = getAutoSemester(document.getElementById('form-absen-tanggal').value);
      }

      adjustFormForRole();
      setupGuruField();
      setupKelasField();
    }

    function setupKelasField() {
      const role = getCurrentRole();
      const userKelas = getLoggedInKelas();
      const inputKelas = document.getElementById('form-absen-kelas');
      if (!inputKelas) return;

      if (role.toLowerCase() === 'murid' && userKelas) {
        inputKelas.value = userKelas;
        inputKelas.readOnly = true;
        inputKelas.classList.add('bg-amber-50', 'border-amber-300', 'font-bold', 'text-amber-900', 'cursor-not-allowed');

        // Batasi datalist hanya berisi kelas murid tersebut
        const dl = document.getElementById('list-form-absen-kelas');
        if (dl) {
          dl.innerHTML = `<option value="${userKelas}"></option>`;
        }

        // Tampilkan badge indikator kelas terkunci
        let badgeKelas = document.getElementById('badge-kelas-locked');
        if (!badgeKelas) {
          badgeKelas = document.createElement('div');
          badgeKelas.id = 'badge-kelas-locked';
          badgeKelas.className = 'mt-1 text-[10px] text-amber-700 font-semibold flex items-center gap-1';
          badgeKelas.innerHTML = `<i class="fa-solid fa-lock text-amber-600"></i> Terkunci untuk kelas: <strong>${userKelas}</strong> (Hak Akses Murid)`;
          inputKelas.parentElement.parentElement.appendChild(badgeKelas);
        }
      } else {
        inputKelas.readOnly = false;
        inputKelas.classList.remove('bg-amber-50', 'border-amber-300', 'font-bold', 'text-amber-900', 'cursor-not-allowed');
        const badgeKelas = document.getElementById('badge-kelas-locked');
        if (badgeKelas) badgeKelas.remove();
      }
    }

    function setupGuruField() {
      const role = getCurrentRole();
      const loggedGuru = getLoggedInNamaGuru();
      const selGuru = document.getElementById('form-absen-guru');
      if (!selGuru) return;

      const guruList = (window.globalData && window.globalData.guruList) ? window.globalData.guruList : [];
      const guruNames = guruList.map(g => g.nama);

      if (role === 'Guru') {
        const guruVal = loggedGuru || getCurrentUser();
        selGuru.innerHTML = `<option value="${guruVal}">${guruVal}</option>`;
        selGuru.value = guruVal;
        selGuru.disabled = true;
        selGuru.classList.add('bg-slate-100', 'cursor-not-allowed', 'font-bold', 'text-slate-700');
      } else if (role.toLowerCase() === 'murid') {
        selGuru.disabled = false;
        selGuru.classList.remove('bg-slate-100', 'cursor-not-allowed', 'font-bold');
        populateSelect('form-absen-guru', guruNames, '-- Pilih Guru Pengajar --');
      } else {
        selGuru.disabled = false;
        selGuru.classList.remove('bg-slate-100', 'cursor-not-allowed', 'font-bold');
        populateSelect('form-absen-guru', guruNames, '-- Pilih Guru --', loggedGuru);
      }
    }

    function loadMuridForAbsen() {
      const role = getCurrentRole();
      const userKelas = getLoggedInKelas();
      let kelas = document.getElementById('form-absen-kelas').value;
      const tanggal = document.getElementById('form-absen-tanggal').value;

      if (role.toLowerCase() === 'murid' && userKelas) {
        kelas = userKelas;
        document.getElementById('form-absen-kelas').value = userKelas;
      }

      if (!kelas) {
        showToast('warning', 'Pilih Kelas', 'Silakan pilih kelas terlebih dahulu.');
        return;
      }

      const filtered = (window.globalData.muridList || []).filter(m => m.kelas === kelas);

      if (filtered.length === 0) {
        document.getElementById('container-input-absen').classList.add('hidden');
        Swal.fire({
          icon: 'info',
          title: 'Tidak Ada Siswa',
          text: `Belum ada data siswa yang terdaftar di kelas "${kelas}". Silakan cek Master Data.`,
          confirmButtonColor: '#2563eb'
        });
        return;
      }

      showLoading('Memeriksa Catatan Presensi Kelas...');
      google.script.run
        .withSuccessHandler(function(syncRes) {
          closeLoading();
          renderStudentAttendanceTable(filtered, kelas, tanggal, syncRes);
        })
        .withFailureHandler(function(err) {
          closeLoading();
          renderStudentAttendanceTable(filtered, kelas, tanggal, { success: false, found: false });
        })
        .getExistingPresensiForClass(tanggal, kelas);
    }

    function renderStudentAttendanceTable(filtered, kelas, tanggal, syncRes) {
      const tbody = document.getElementById('tbody-input-absen');
      tbody.innerHTML = "";

      document.getElementById('label-kelas-terpilih').innerText = kelas;
      document.getElementById('count-murid-loaded').innerText = filtered.length;

      const bannerSync = document.getElementById('banner-presensi-sinkron');
      const hasExisting = syncRes && syncRes.found;

      if (bannerSync) {
        if (hasExisting) {
          bannerSync.className = 'p-3.5 bg-blue-50/90 border border-blue-200 rounded-2xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-blue-900 shadow-sm animate-fadeIn mb-2';
          bannerSync.innerHTML = `
            <div class="flex items-start sm:items-center gap-3">
              <div class="w-8 h-8 rounded-xl bg-blue-100 text-brand-700 flex items-center justify-center text-sm flex-shrink-0">
                <i class="fa-solid fa-cloud-arrow-down"></i>
              </div>
              <div>
                <p class="text-xs font-bold text-blue-900">Data Presensi Ditemukan (${syncRes.source})</p>
                <p class="text-[11px] text-blue-700 leading-relaxed">
                  Status kehadiran siswa telah disinkronkan otomatis dari rekaman tanggal <strong>${tanggal}</strong>. Anda dapat langsung meninjau atau memperbarui data jika terdapat perubahan.
                </p>
              </div>
            </div>
            <span class="px-2.5 py-1 bg-blue-200/70 text-blue-900 rounded-lg font-extrabold text-[10px] border border-blue-300 flex-shrink-0 flex items-center gap-1">
              <i class="fa-solid fa-check-double"></i> Otomatis Terisi
            </span>
          `;
          bannerSync.classList.remove('hidden');
          showToast('info', 'Presensi Tersinkron', 'Status siswa otomatis terisi dari ' + syncRes.source);
        } else {
          bannerSync.classList.add('hidden');
          bannerSync.innerHTML = '';
        }
      }

      filtered.forEach((m, i) => {
        let currentKet = 'Hadir';
        if (hasExisting) {
          if (syncRes.studentsMap && syncRes.studentsMap[m.nisn]) {
            currentKet = syncRes.studentsMap[m.nisn];
          } else if (syncRes.studentsByName && syncRes.studentsByName[m.nama.toLowerCase()]) {
            currentKet = syncRes.studentsByName[m.nama.toLowerCase()];
          }
        }

        const options = ['Hadir', 'Sakit', 'Izin', 'Alpa', 'Dispen'].map(opt => {
          const isSelected = opt.toLowerCase() === currentKet.toLowerCase() ? 'selected' : '';
          return `<option value="${opt}" ${isSelected}>${opt}</option>`;
        }).join('');

        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 text-center text-slate-400 font-mono text-[11px]">${i + 1}</td>
            <td class="p-3 font-mono text-slate-500 text-[11px]">${m.nisn}</td>
            <td class="p-3 font-semibold text-slate-800">${m.nama}</td>
            <td class="p-3 text-center">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold ${m.jk === 'L' ? 'bg-blue-50 text-brand-700' : 'bg-pink-50 text-pink-700'}">
                ${m.jk || '-'}
              </span>
            </td>
            <td class="p-3">
              <select data-nisn="${m.nisn}" data-nama="${m.nama}" data-jk="${m.jk}" 
                      class="select-ket-absen w-full text-xs p-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-brand-500 bg-white font-medium text-slate-700">
                ${options}
              </select>
            </td>
          </tr>
        `;
      });

      document.getElementById('container-input-absen').classList.remove('hidden');
      document.getElementById('container-input-absen').scrollIntoView({ behavior: 'smooth' });
    }

    function setSemuaStatus(status) {
      document.querySelectorAll('.select-ket-absen').forEach(el => {
        el.value = status;
      });
      showToast('info', 'Diperbarui', `Semua siswa ditandai sebagai: ${status}`);
    }

    function submitAbsensiData() {
      const role = getCurrentRole();
      const isMurid = role.toLowerCase() === 'murid';
      const userKelas = getLoggedInKelas();
      const loggedName = getLoggedInNamaGuru() || getCurrentUser();
      
      let guru = '';
      let mapel = '';

      if (isMurid) {
        guru = 'Murid (' + (loggedName || 'Sekretaris') + ')';
        mapel = 'Presensi Harian';
      } else {
        const loggedGuru = getLoggedInNamaGuru();
        guru = (role === 'Guru' && loggedGuru) ? loggedGuru : (document.getElementById('form-absen-guru').value || loggedGuru || getCurrentUser());
        mapel = document.getElementById('form-absen-mapel').value;
      }

      const kelas = (isMurid && userKelas) ? userKelas : document.getElementById('form-absen-kelas').value;
      const semester = document.getElementById('form-absen-semester').value;
      const tanggal = document.getElementById('form-absen-tanggal').value;
      const ta = document.getElementById('form-absen-ta').value;

      if (!guru || !mapel || !kelas || !semester || !tanggal || !ta) {
        showToast('warning', 'Data Belum Lengkap', 'Pastikan semua kolom parameter absensi telah terisi.');
        return;
      }

      const attendanceList = Array.from(document.querySelectorAll('.select-ket-absen')).map(s => ({
        nisn: s.getAttribute('data-nisn'),
        nama: s.getAttribute('data-nama'),
        jk: s.getAttribute('data-jk'),
        keterangan: s.value
      }));

      if (attendanceList.length === 0) {
        showToast('error', 'Gagal', 'Daftar presensi siswa kosong.');
        return;
      }

      const formHeader = { namaGuru: guru, mapel, kelas, semester, tanggal, tahunAjaran: ta };

      showLoading('Menyimpan Absensi...');
      google.script.run
        .withSuccessHandler(function(res) {
          closeLoading();
          if (res && res.success) {
            if (isMurid) {
              Swal.fire({
                icon: 'success',
                title: 'Absensi Tersimpan!',
                text: `Berhasil mencatat ${res.count} presensi siswa kelas ${kelas} ke database.`,
                confirmButtonColor: '#2563eb',
                confirmButtonText: 'Selesai / Input Lagi'
              }).then(() => {
                document.getElementById('container-input-absen').classList.add('hidden');
              });
            } else {
              Swal.fire({
                icon: 'success',
                title: 'Absensi Tersimpan!',
                text: `Berhasil mencatat ${res.count} presensi siswa kelas ${kelas} ke database.`,
                confirmButtonColor: '#2563eb',
                confirmButtonText: 'Buka Rekap Absen',
                showCancelButton: true,
                cancelButtonText: 'Input Lagi'
              }).then(result => {
                if (result.isConfirmed) {
                  navigateTo('rekap-absen');
                } else {
                  document.getElementById('container-input-absen').classList.add('hidden');
                }
              });
            }
          } else {
            Swal.fire({
              icon: 'error',
              title: 'Gagal Menyimpan',
              text: (res && res.message) ? res.message : 'Terjadi kesalahan di server.'
            });
          }
        })
        .withFailureHandler(function(err) {
          closeLoading();
          Swal.fire({
            icon: 'error',
            title: 'Kesalahan Sistem',
            text: err.message
          });
        })
        .submitAbsensi(formHeader, attendanceList);
    }
  </script>
</body>
</html>
