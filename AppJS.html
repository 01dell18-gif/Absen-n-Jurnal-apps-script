<script>
/**
 * APPJS: PUSTAKA LOGIKA CLIENT GLOBAL
 * Arsitektur RPC (google.script.run), Session Management & Routing
 */

// Global State
window.globalData = window.globalData || {
  pengaturan: { namaSekolah: 'NAMA SEKOLAH', logoUrl: 'https://via.placeholder.com/60', mapelList: [], kelasList: [], taList: [] },
  muridList: [],
  guruList: []
};

// Global App URL definition
window.APP_URL = "<?= (typeof appUrl !== 'undefined' && appUrl) ? appUrl : getAppUrl() ?>";

// Dapatkan URL Web App resmi secara asinkron jika tersedia
if (window.google && google.script && google.script.url) {
  google.script.url.getLocation(function(loc) {
    if (loc && loc.url) {
      const cleanUrl = loc.url.split('?')[0];
      if (!cleanUrl.includes('googleusercontent.com')) {
        window.APP_URL = cleanUrl;
        try {
          sessionStorage.setItem('siguru_app_url', cleanUrl);
          localStorage.setItem('siguru_app_url', cleanUrl);
        } catch(e) {}
      }
    }
  });
}

// URL Router & Helper
function getAppUrl() {
  if (window.APP_URL && window.APP_URL.length > 5 && !window.APP_URL.includes('googleusercontent.com')) {
    return window.APP_URL;
  }
  const cachedUrl = sessionStorage.getItem('siguru_app_url') || localStorage.getItem('siguru_app_url');
  if (cachedUrl && cachedUrl.length > 5 && !cachedUrl.includes('googleusercontent.com')) {
    return cachedUrl;
  }
  try {
    if (window.top && window.top.location && window.top.location.href) {
      const topHref = window.top.location.href.split('?')[0];
      if (!topHref.includes('googleusercontent.com')) {
        return topHref;
      }
    }
  } catch (e) {}
  if (window.APP_URL && !window.APP_URL.includes('googleusercontent.com')) {
    return window.APP_URL;
  }
  return '';
}

function goToPage(page, params) {
  const currentRole = getCurrentRole();
  const r = (currentRole || 'Guest').trim().toLowerCase();

  // Role Gatekeeping untuk Murid: HANYA BOLEH AKSES 'form-absen'
  if (r === 'murid') {
    if (page !== 'form-absen') {
      showToast('info', 'Akses Terbatas', 'Akun Murid hanya memiliki akses ke menu Absen Siswa.');
      navigateTo('form-absen');
      return;
    }
  }

  // Role Gatekeeping untuk Guest
  if ((page === 'form-absen' || page === 'form-jurnal') && r === 'guest') {
    Swal.fire({
      icon: 'warning',
      title: 'Akses Dibatasi',
      text: 'Silakan login sebagai Guru, Admin, atau Murid untuk mengisi presensi.',
      confirmButtonColor: '#2563eb',
      confirmButtonText: 'Login Sekarang',
      showCancelButton: true,
      cancelButtonText: 'Batal'
    }).then(res => {
      if (res.isConfirmed) openLoginModal();
    });
    return;
  }

  const isAdmin = currentRole && (currentRole.toLowerCase() === 'admin' || currentRole.toLowerCase() === 'administrator');
  if ((page === 'master-data' || page === 'user-management' || page === 'pengaturan' || page === 'pengaturan-sistem') && !isAdmin) {
    showToast('error', 'Akses Ditolak', 'Halaman ini khusus untuk Administrator.');
    return;
  }

  navigateTo(page, params);
}

function navigateTo(page, params) {
  sessionStorage.setItem('siguru_active_page', page);
  localStorage.setItem('siguru_active_page', page);

  let baseUrl = getAppUrl();
  let query = '?page=' + encodeURIComponent(page);
  if (params && typeof params === 'object') {
    for (let k in params) {
      if (params.hasOwnProperty(k)) {
        query += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
      }
    }
  }

  let url = baseUrl ? (baseUrl.split('?')[0] + query) : query;

  // Penting: Google Apps Script berjalan di dalam iframe sandbox.
  // 1. Coba navigasi via anchor _top (cara paling kompatibel dengan iframe sandbox Google Apps Script)
  try {
    const a = document.createElement('a');
    a.href = url;
    a.target = '_top';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(function() {
      try { document.body.removeChild(a); } catch (e) {}
    }, 100);
    return;
  } catch (e1) {}

  // 2. Coba arahkan window.top.location.href secara langsung
  try {
    if (window.top && window.top !== window) {
      window.top.location.href = url;
      return;
    }
  } catch (e2) {}

  // 3. Coba window.open _top
  try {
    window.open(url, '_top');
    return;
  } catch (e3) {}

  // 4. Fallback akhir jika bukan dalam iframe sandbox
  if (!url.includes('googleusercontent.com')) {
    window.location.href = url;
  }
}

// User Session Management
function getCurrentUser() {
  return localStorage.getItem('siguru_username') || '';
}

function getCurrentRole() {
  return localStorage.getItem('siguru_role') || 'Guest';
}

function getLoggedInKelas() {
  return localStorage.getItem('siguru_kelas') || '';
}

function getLoggedInNamaGuru() {
  let ng = localStorage.getItem('siguru_nama_guru') || '';
  const role = getCurrentRole();
  const uname = getCurrentUser();

  // Jika nama guru masih kosong atau berisi default placeholder
  if (!ng || ng.toLowerCase() === 'user' || (role === 'Admin' && ng.toLowerCase() === 'admin')) {
    if (role === 'Admin') {
      ng = (ng && ng.toLowerCase() !== 'admin') ? ng : 'Administrator';
    } else if (role.toLowerCase() === 'murid') {
      ng = ng || uname;
    } else if (uname && window.globalData && window.globalData.guruList && window.globalData.guruList.length > 0) {
      // Cari nama guru di Master Data yang cocok dengan username atau NIP
      const match = window.globalData.guruList.find(g => 
        (g.nama && g.nama.toLowerCase() === uname.toLowerCase()) || 
        (g.nip && uname && g.nip.toLowerCase() === uname.toLowerCase())
      );
      if (match) {
        ng = match.nama;
        localStorage.setItem('siguru_nama_guru', ng);
        if (match.nip) localStorage.setItem('siguru_nip', match.nip);
      }
    }
  }
  return ng || uname;
}

function getLoggedInNip() {
  return localStorage.getItem('siguru_nip') || '';
}

function setSessionUser(username, role, namaGuru = '', nip = '', kelas = '') {
  if (role === 'Admin' && !namaGuru) namaGuru = 'Administrator';
  localStorage.setItem('siguru_username', username);
  localStorage.setItem('siguru_role', role);
  localStorage.setItem('siguru_nama_guru', namaGuru);
  localStorage.setItem('siguru_nip', nip);
  localStorage.setItem('siguru_kelas', kelas || '');
  applyRoleUI();
}

function clearSession() {
  localStorage.removeItem('siguru_username');
  localStorage.removeItem('siguru_role');
  localStorage.removeItem('siguru_nama_guru');
  localStorage.removeItem('siguru_nip');
  localStorage.removeItem('siguru_kelas');
  applyRoleUI();
}

// UI & Notifications Helpers
const Toast = Swal.mixin({
  toast: true,
  position: 'top-end',
  showConfirmButton: false,
  timer: 3500,
  timerProgressBar: true,
  didOpen: (toast) => {
    toast.onmouseenter = Swal.stopTimer;
    toast.onmouseleave = Swal.resumeTimer;
  }
});

function showToast(icon, title, text = '') {
  Toast.fire({
    icon: icon,
    title: title,
    text: text
  });
}

function showLoading(title = 'Memproses Data...') {
  Swal.fire({
    title: title,
    html: '<div class="py-2 text-xs text-slate-500">Mohon tunggu, menghubungkan ke server Google Cloud...</div>',
    allowOutsideClick: false,
    showConfirmButton: false,
    didOpen: () => {
      Swal.showLoading();
    }
  });
}

function closeLoading() {
  Swal.close();
}

// Sidebar Mobile Toggle
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const headerBrand = document.getElementById('header-brand-info');
  
  if (window.innerWidth >= 768) {
    sidebar.classList.toggle('-ml-64');
    if (headerBrand) headerBrand.classList.toggle('hidden');
  } else {
    sidebar.classList.toggle('-translate-x-full');
    if (overlay) overlay.classList.toggle('hidden');
  }
}

// Modal Login Triggers
function openLoginModal() {
  const modal = document.getElementById('modal-login');
  if (modal) modal.classList.remove('hidden');
}

function closeLoginModal() {
  const modal = document.getElementById('modal-login');
  if (modal) modal.classList.add('hidden');
}

function toggleHeaderLoginPass() {
  const input = document.getElementById('login-pass');
  const icon = document.getElementById('login-pass-eye');
  if (!input || !icon) return;
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash', 'text-brand-600');
  } else {
    input.type = 'password';
    icon.classList.remove('fa-eye-slash', 'text-brand-600');
    icon.classList.add('fa-eye');
  }
}

function handleLoginSubmit(e) {
  e.preventDefault();
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value.trim();
  
  if (!username || !password) {
    showToast('warning', 'Perhatian', 'Username dan password wajib diisi.');
    return;
  }

  showLoading('Verifikasi Akun...');
  google.script.run
    .withSuccessHandler(function(res) {
      closeLoading();
      if (res.success) {
        setSessionUser(username, res.role, res.namaGuru || '', res.nip || '', res.kelas || '');
        closeLoginModal();
        Swal.fire({
          icon: 'success',
          title: 'Login Berhasil',
          text: `Selamat datang, ${res.namaGuru || username}! Anda masuk sebagai ${res.role}.`,
          timer: 1800,
          showConfirmButton: false
        }).then(() => {
          if (res.role && res.role.toLowerCase() === 'murid') {
            navigateTo('form-absen');
            return;
          }
          // If on login page, go to dashboard
          const urlParams = new URLSearchParams(window.location.search);
          const p = urlParams.get('page');
          if (p === 'login' || !p) {
            navigateTo('dashboard');
          } else {
            navigateTo(p);
          }
        });
      } else {
        Swal.fire({
          icon: 'error',
          title: 'Akses Ditolak',
          text: res.message || 'Username atau password salah!',
          confirmButtonColor: '#2563eb'
        });
      }
    })
    .withFailureHandler(function(err) {
      closeLoading();
      Swal.fire({
        icon: 'error',
        title: 'Koneksi Gagal',
        text: 'Terjadi kesalahan sistem: ' + err.message,
        confirmButtonColor: '#2563eb'
      });
    })
    .checkLogin(username, password);
}

function logoutUser() {
  Swal.fire({
    title: 'Konfirmasi Keluar',
    text: 'Apakah Anda yakin ingin keluar dari sistem?',
    icon: 'question',
    showCancelButton: true,
    confirmButtonColor: '#ef4444',
    cancelButtonColor: '#64748b',
    confirmButtonText: 'Ya, Keluar',
    cancelButtonText: 'Batal'
  }).then(result => {
    if (result.isConfirmed) {
      clearSession();
      showToast('info', 'Anda telah logout', 'Dialihkan ke tampilan publik.');
      setTimeout(() => {
        navigateTo('rekap-absen');
      }, 700);
    }
  });
}

    if (groupAdmin) groupAdmin.classList.add('hidden');
    if (groupRekap) groupRekap.classList.add('hidden');
    if (groupPengaturan) groupPengaturan.classList.add('hidden');

    // Sembunyikan Dashboard & Input Jurnal KBM, HANYA tampilkan Absen Murid

// Hapus Cache Web & Kembali ke Dashboard Utama
function clearAppCache() {
  Swal.fire({
    title: 'Hapus Cache Web?',
    html: 'Seluruh data cache dan sesi lokal di peramban akan dibersihkan, kemudian sistem akan kembali ke <strong>Dashboard Utama</strong>.',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#d97706',
    cancelButtonColor: '#64748b',
    confirmButtonText: '<i class="fa-solid fa-trash-can mr-1.5"></i> Hapus & ke Dashboard',
    cancelButtonText: 'Batal'
  }).then((result) => {
    if (result.isConfirmed) {
      // 1. Simpan URL aplikasi yang valid sebelum storage dibersihkan
      const appUrl = getAppUrl();

      // 2. Bersihkan seluruh data lokal peramban
      try {
        localStorage.clear();
        sessionStorage.clear();
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
        }
      } catch (e) {}

      // 3. Set penanda agar Dashboard menampilkan toast sukses dan restore appUrl
      try {
        sessionStorage.setItem('siguru_active_page', 'dashboard');
        localStorage.setItem('siguru_active_page', 'dashboard');
        sessionStorage.setItem('siguru_cache_cleared', 'true');
        if (appUrl) {
          sessionStorage.setItem('siguru_app_url', appUrl);
        }
      } catch (e) {}

      // 4. Langsung arahkan kembali ke menu awal dashboard
      navigateTo('dashboard');
    }
  });
}

// Data Synchronizer
function refreshAllData(onSuccess) {
  const icon = document.getElementById('icon-refresh');
  if (icon) icon.classList.add('fa-spin');

  // Check cached data if available
  const cached = localStorage.getItem('siguru_global_data');
  if (cached && !window.globalData.pengaturan.mapelList.length) {
    try {
      window.globalData = JSON.parse(cached);
      updateBrandingUI();
    } catch(e) {}
  }

  google.script.run
    .withSuccessHandler(function(res) {
      if (icon) icon.classList.remove('fa-spin');
      if (res && res.pengaturan) {
        window.globalData = res;
        localStorage.setItem('siguru_global_data', JSON.stringify(res));
        updateBrandingUI();
        if (typeof onSuccess === 'function') onSuccess(res);
        if (typeof onDataLoaded === 'function') onDataLoaded(res);
      }
    })
    .withFailureHandler(function(err) {
      if (icon) icon.classList.remove('fa-spin');
      showToast('error', 'Gagal Sinkronisasi', err.message);
    })
    .getInitialData();
}

function updateBrandingUI() {
  const p = window.globalData.pengaturan;
  if (!p) return;

  const sidebarLogo = document.getElementById('sidebar-logo');
  const sidebarSekolah = document.getElementById('sidebar-sekolah');
  const headerLogo = document.getElementById('header-logo');
  const headerSekolah = document.getElementById('header-sekolah');
  const loginLogo = document.getElementById('login-modal-logo');

  if (sidebarLogo && p.logoUrl) sidebarLogo.src = p.logoUrl;
  if (sidebarSekolah && p.namaSekolah) sidebarSekolah.innerText = p.namaSekolah;
  if (headerLogo && p.logoUrl) headerLogo.src = p.logoUrl;
  if (headerSekolah && p.namaSekolah) headerSekolah.innerText = p.namaSekolah;
  if (loginLogo && p.logoUrl) loginLogo.src = p.logoUrl;
}

// Helper Akademik: Otomatisasi Semester & Tahun Ajaran
function getAutoSemester(dateInput) {
  let m;
  if (dateInput) {
    if (typeof dateInput === 'string' && dateInput.includes('-')) {
      const parts = dateInput.split('-');
      if (parts.length >= 2) m = parseInt(parts[1], 10);
    } else if (dateInput instanceof Date && !isNaN(dateInput)) {
      m = dateInput.getMonth() + 1;
    }
  }
  if (!m) {
    m = new Date().getMonth() + 1;
  }
  // Ganjil: Juli - Desember (7 - 12), Genap: Januari - Juni (1 - 6)
  return (m >= 7 && m <= 12) ? 'Ganjil' : 'Genap';
}

function getActiveTahunAjaran() {
  const p = (window.globalData && window.globalData.pengaturan) ? window.globalData.pengaturan : null;
  if (p && p.tahunAjaranAktif) return p.tahunAjaranAktif;
  if (p && p.taList && p.taList.length > 0) return p.taList[0];
  return '';
}

// Dropdown & Searchable Combobox Helper Utility
function populateSelect(selectId, items, placeholder = '-- Pilih --', selectedVal = '') {
  const el = document.getElementById(selectId);
  if (!el) return;

  // Jika kolom Tahun Ajaran dan selectedVal belum ditentukan, otomatis pilih Tahun Ajaran Aktif
  if (!selectedVal && selectId.toLowerCase().includes('-ta') && typeof getActiveTahunAjaran === 'function') {
    const activeTa = getActiveTahunAjaran();
    if (activeTa && (items || []).includes(activeTa)) {
      selectedVal = activeTa;
    }
  }

  // Kasus 1: Elemen adalah INPUT teks ber-datalist
  if (el.tagName === 'INPUT' && el.getAttribute('list')) {
    const listId = el.getAttribute('list');
    let dl = document.getElementById(listId);
    if (!dl) {
      dl = document.createElement('datalist');
      dl.id = listId;
      if (el.parentNode) el.parentNode.appendChild(dl);
    }
    dl.innerHTML = '';
    (items || []).forEach(item => {
      if (!item) return;
      const opt = document.createElement('option');
      opt.value = item;
      dl.appendChild(opt);
    });

    if (placeholder) {
      el.placeholder = placeholder;
    }
    if (selectedVal !== undefined && selectedVal !== null && selectedVal !== '') {
      el.value = selectedVal;
    }
    return;
  }

  // Kasus 2: Elemen adalah DATALIST langsung
  if (el.tagName === 'DATALIST') {
    el.innerHTML = '';
    (items || []).forEach(item => {
      if (!item) return;
      const opt = document.createElement('option');
      opt.value = item;
      el.appendChild(opt);
    });
    const pairedInput = document.querySelector(`input[list="${selectId}"]`);
    if (pairedInput) {
      if (placeholder) pairedInput.placeholder = placeholder;
      if (selectedVal !== undefined && selectedVal !== null && selectedVal !== '') pairedInput.value = selectedVal;
    }
    return;
  }

  // Kasus 3: SELECT konvensional
  el.innerHTML = '';
  if (placeholder) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = placeholder;
    el.appendChild(opt);
  }
  (items || []).forEach(item => {
    const opt = document.createElement('option');
    opt.value = item;
    opt.textContent = item;
    if (selectedVal && selectedVal === item) opt.selected = true;
    el.appendChild(opt);
  });
}
