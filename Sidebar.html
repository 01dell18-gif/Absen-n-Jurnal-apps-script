  <script>
    function toggleNavGroup(groupKey) {
      const submenu = document.getElementById('submenu-' + groupKey);
      const chevron = document.getElementById('chevron-' + groupKey);
      if (!submenu) return;
      const isHidden = submenu.classList.contains('hidden');
      if (isHidden) {
        submenu.classList.remove('hidden');
        if (chevron) chevron.classList.remove('-rotate-90');
        sessionStorage.setItem('siguru_nav_' + groupKey, 'open');
      } else {
        submenu.classList.add('hidden');
        if (chevron) chevron.classList.add('-rotate-90');
        sessionStorage.setItem('siguru_nav_' + groupKey, 'closed');
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      // Inisialisasi buka-tutup grup menu sesuai preferensi atau active page
      const current = "<?= (typeof currentPage !== 'undefined') ? currentPage : '' ?>";
      const groupMap = {
        'utama': ['dashboard', 'form-absen', 'form-jurnal'],
        'master': ['master-data'],
        'rekap': ['rekap-absen', 'hasil-jurnal'],
        'pengaturan': ['pengaturan', 'user-management']
      };

      Object.keys(groupMap).forEach(key => {
        const submenu = document.getElementById('submenu-' + key);
        const chevron = document.getElementById('chevron-' + key);
        if (!submenu) return;
        const saved = sessionStorage.getItem('siguru_nav_' + key);
        const isCurrentInGroup = groupMap[key].includes(current);

        if (isCurrentInGroup || saved === 'open' || saved === null) {
          submenu.classList.remove('hidden');
          if (chevron) chevron.classList.remove('-rotate-90');
        } else if (saved === 'closed') {
          submenu.classList.add('hidden');
          if (chevron) chevron.classList.add('-rotate-90');
        }
      });
    });
  </script>
